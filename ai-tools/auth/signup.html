<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Hub - Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF6B6B 0%, #FFC93C 25%, #6BCB77 50%, #4D96FF 75%, #9B59B6 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .signup-container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            max-width: 900px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .signup-form {
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .signup-illustration {
            background: linear-gradient(135deg, #FF6B6B, #FFC93C);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .illustration-char {
            font-size: 120px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        .floating-icons {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .floating-icon {
            position: absolute;
            font-size: 40px;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .floating-icon:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
        .floating-icon:nth-child(2) { top: 60%; right: 15%; animation-delay: 1s; }
        .floating-icon:nth-child(3) { bottom: 20%; left: 20%; animation-delay: 2s; }

        .illustration-text {
            color: white;
            text-align: center;
            margin-top: 30px;
            position: relative;
            z-index: 10;
        }

        .illustration-text h2 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .illustration-text p {
            font-size: 16px;
            opacity: 0.9;
        }

        h1 {
            color: #FF6B6B;
            font-size: 32px;
            margin-bottom: 10px;
            animation: wiggle 2s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-2deg); }
            75% { transform: rotate(2deg); }
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            animation: slideIn 0.6s ease-out backwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 3px solid #FFD700;
            border-radius: 15px;
            font-size: 14px;
            font-family: 'Comic Sans MS', sans-serif;
            transition: all 0.3s ease;
            background: #FFF9E6;
        }

        input:focus {
            outline: none;
            border-color: #FF6B6B;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1);
            transform: scale(1.02);
        }

        input::placeholder {
            color: #999;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle .toggle-eye {
            position: absolute;
            right: 15px;
            top: 38px;
            cursor: pointer;
            color: #FF6B6B;
            font-size: 18px;
            transition: all 0.3s;
        }

        .password-toggle .toggle-eye:hover {
            transform: scale(1.2);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #FF6B6B;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-size: 12px;
        }

        .signup-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #FF6B6B, #FFC93C);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Comic Sans MS', sans-serif;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.6s backwards;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .signup-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        .signup-btn:active {
            transform: translateY(-1px);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #FF6B6B;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .login-link a:hover {
            text-decoration: underline;
            transform: scale(1.05);
        }

        .social-divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #999;
        }

        .social-divider span {
            padding: 0 10px;
            font-size: 12px;
        }

        .social-divider::before,
        .social-divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: #DDD;
        }

        .social-buttons {
            display: flex;
            gap: 10px;
        }

        .social-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #DDD;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }

        .social-btn:hover {
            border-color: #FF6B6B;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .signup-container {
                grid-template-columns: 1fr;
            }

            .signup-illustration {
                display: none;
            }

            .signup-form {
                padding: 40px 25px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-form">
            <h1>🎉 Join the Fun!</h1>
            <p class="subtitle">Create your account and start using AI tools</p>

            <div class="social-buttons">
                <button class="social-btn" title="Sign up with Google">🔍</button>
                <button class="social-btn" title="Sign up with GitHub">🐙</button>
                <button class="social-btn" title="Sign up with Twitter">🐦</button>
            </div>

            <div class="social-divider">
                <span>OR</span>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group password-toggle">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 8 characters" required>
                    <i class="fas fa-eye toggle-eye" onclick="togglePassword()"></i>
                </div>

                <div class="form-group password-toggle">
                    <label for="confirm">Confirm Password</label>
                    <input type="password" id="confirm" placeholder="Confirm your password" required>
                    <i class="fas fa-eye toggle-eye" onclick="toggleConfirmPassword()"></i>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the Terms of Service and Privacy Policy</label>
                </div>

                <button type="submit" class="signup-btn">🚀 Create Account</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Log in here</a>
            </div>
        </div>

        <div class="signup-illustration">
            <div class="floating-icons">
                <div class="floating-icon">✨</div>
                <div class="floating-icon">🎨</div>
                <div class="floating-icon">💡</div>
            </div>
            <div class="illustration-char">🤖</div>
            <div class="illustration-text">
                <h2>Welcome!</h2>
                <p>Join thousands of creators using AI</p>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleEye = document.querySelector('.password-toggle .toggle-eye');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleEye.className = 'fas fa-eye-slash toggle-eye';
            } else {
                passwordInput.type = 'password';
                toggleEye.className = 'fas fa-eye toggle-eye';
            }
        }

        function toggleConfirmPassword() {
            const confirmInput = document.getElementById('confirm');
            const toggleEyes = document.querySelectorAll('.password-toggle .toggle-eye');
            if (confirmInput.type === 'password') {
                confirmInput.type = 'text';
                toggleEyes[1].className = 'fas fa-eye-slash toggle-eye';
            } else {
                confirmInput.type = 'password';
                toggleEyes[1].className = 'fas fa-eye toggle-eye';
            }
        }

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            if (password !== confirm) {
                alert('Passwords do not match!');
                return;
            }

            if (password.length < 8) {
                alert('Password must be at least 8 characters long!');
                return;
            }

            alert('Account created successfully! 🎉');
            // Redirect to dashboard
            window.location.href = '../dashboard/index.html';
        });
    </script>
</body>
</html>

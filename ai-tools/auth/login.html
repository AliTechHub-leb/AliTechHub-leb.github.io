<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Hub - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6BCB77 0%, #4D96FF 50%, #9B59B6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: slideBackground 10s ease infinite;
        }

        @keyframes slideBackground {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .login-container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            max-width: 450px;
            width: 100%;
            animation: popUp 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popUp {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 60px;
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            color: #6BCB77;
            font-size: 28px;
            margin-top: 15px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
            animation: slideInLeft 0.6s ease-out backwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.2s; }
        .form-group:nth-child(2) { animation-delay: 0.3s; }
        .form-group:nth-child(3) { animation-delay: 0.4s; }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 3px solid #4D96FF;
            border-radius: 15px;
            font-size: 14px;
            font-family: 'Comic Sans MS', sans-serif;
            transition: all 0.3s ease;
            background: #E8F4FF;
        }

        input:focus {
            outline: none;
            border-color: #6BCB77;
            background: white;
            box-shadow: 0 0 0 4px rgba(107, 203, 119, 0.1);
            transform: scale(1.02);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 12px;
        }

        .remember-forgot a {
            color: #6BCB77;
            text-decoration: none;
            transition: all 0.3s;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
            color: #4D96FF;
        }

        .remember-forgot input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #6BCB77;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6BCB77, #4D96FF);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Comic Sans MS', sans-serif;
            box-shadow: 0 5px 15px rgba(107, 203, 119, 0.3);
            animation: slideUp 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.5s backwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(107, 203, 119, 0.5);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .social-divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #999;
        }

        .social-divider span {
            padding: 0 10px;
            font-size: 12px;
        }

        .social-divider::before,
        .social-divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: #DDD;
        }

        .social-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .social-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #DDD;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
        }

        .social-btn:hover {
            border-color: #6BCB77;
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .signup-link a {
            color: #6BCB77;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .signup-link a:hover {
            text-decoration: underline;
            transform: scale(1.05);
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle .toggle-eye {
            position: absolute;
            right: 15px;
            top: 36px;
            cursor: pointer;
            color: #6BCB77;
            font-size: 18px;
            transition: all 0.3s;
        }

        .password-toggle .toggle-eye:hover {
            transform: scale(1.2);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .logo {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">🤖</div>
            <h1>Welcome Back!</h1>
            <p class="subtitle">Log in to your account to continue</p>
        </div>

        <div class="social-buttons">
            <button class="social-btn" title="Login with Google">🔍</button>
            <button class="social-btn" title="Login with GitHub">🐙</button>
            <button class="social-btn" title="Login with Twitter">🐦</button>
        </div>

        <div class="social-divider">
            <span>OR</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group password-toggle">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
                <i class="fas fa-eye toggle-eye" onclick="togglePassword()"></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="forgot-password.html">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">🚀 Login</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign up here</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleEye = document.querySelector('.toggle-eye');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleEye.className = 'fas fa-eye-slash toggle-eye';
            } else {
                passwordInput.type = 'password';
                toggleEye.className = 'fas fa-eye toggle-eye';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Logged in successfully! 🎉');
            window.location.href = '../dashboard/index.html';
        });
    </script>
</body>
</html>
